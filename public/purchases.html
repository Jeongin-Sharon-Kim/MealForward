<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MealForward - 구매 내역</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  .purchase-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .purchase-info h3 { margin: 0 0 6px; font-size: 16px; }
  .purchase-info .breakdown { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  .purchase-info .date { font-size: 12px; color: var(--muted); margin: 0; }
  .status-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .status-badge.UNUSED { background: var(--brand-soft); color: var(--brand-dark); }
  .status-badge.USED { background: var(--info-bg); color: var(--info-text); }
  .status-badge.REFUNDED { background: #f1f1ef; color: var(--muted); }
  .purchase-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .voucher-code {
    margin-top: 8px;
    font-family: monospace;
    font-size: 15px;
    font-weight: 700;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    display: inline-block;
  }
  .use-btn, .refund-btn {
    background: #ffffff;
    color: var(--brand-dark);
    border: 1px solid var(--brand);
  }
  .use-btn:hover:not(:disabled), .refund-btn:hover:not(:disabled) {
    background: var(--brand);
    color: #ffffff;
  }
  .use-btn:disabled, .refund-btn:disabled {
    background: #f1f1ef;
    color: var(--muted);
    border-color: var(--border);
  }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">🍽 MealForward</div>
  <nav>
    <a href="/index.html">홈</a>
    <a href="/store.html">포인트 상점</a>
    <span id="authArea"></span>
  </nav>
</header>
<main>
  <h1>구매 내역</h1>
  <p class="subtitle">사용하기를 누르면 바우처/숫자 코드를 확인할 수 있고, 환불하기를 누르면 결제 시 사용한 포인트로 그대로 환불됩니다.</p>

  <div id="purchaseList"></div>
</main>

<div class="modal-overlay" id="refundModalOverlay" hidden>
  <div class="modal-box">
    <div class="modal-title">환불을 원하십니까?</div>
    <p style="font-size:14px;color:var(--muted);">
      환불 시 결제할 때 사용한 포인트로만 되돌아갑니다.<br />
      (예: 식대 이월 포인트로 구매한 금액은 식대 이월 포인트로 환불되며, 일반 복지 포인트로는 환불되지 않습니다.)
    </p>
    <div id="refundTargetInfo" style="font-size:13px;color:var(--text);margin-bottom:16px;"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-secondary" id="refundCancelBtn">취소</button>
      <button class="btn" id="refundConfirmBtn">환불하기</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const session = requireUserSession();

if (session) {
  document.getElementById('authArea').innerHTML =
    `<span class="name-dropdown"><a href="/dashboard.html">${session.name}님</a><span class="menu"><a href="/dashboard.html">내 식대 &amp; 이월 현황</a><a href="/purchases.html" class="active">구매 내역</a></span></span> <a href="#" id="logoutLink">로그아웃</a>`;
  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    clearSession();
    window.location.href = '/login.html';
  });
}

let purchases = [];
let refundTargetId = null;

function statusLabel(status) {
  if (status === 'UNUSED') return '미사용';
  if (status === 'USED') return '사용완료';
  return '환불완료';
}

function breakdownText(p) {
  const parts = [];
  if (p.generalAmount > 0) parts.push(`일반 복지 포인트 ${Number(p.generalAmount).toLocaleString()}원`);
  if (p.flexiAmount > 0) parts.push(`식대 이월 포인트 ${Number(p.flexiAmount).toLocaleString()}원`);
  return parts.join(' + ');
}

function renderList() {
  const listEl = document.getElementById('purchaseList');

  if (!purchases.length) {
    listEl.innerHTML = `<div class="empty-state">아직 구매 내역이 없습니다. 포인트 상점에서 상품을 구매해보세요.</div>`;
    return;
  }

  listEl.innerHTML = purchases
    .map((p) => {
      const dateStr = p.createdAt.slice(0, 10).replace(/-/g, '. ') + '.';
      const canAct = p.approvalStatus === 'APPROVED' && p.redemptionStatus === 'UNUSED';
      const voucherHtml =
        p.redemptionStatus === 'USED' && p.voucherCode
          ? `<div class="voucher-code">코드: ${p.voucherCode}</div>`
          : '';

      return `
        <div class="card purchase-card" data-id="${p.id}">
          <div class="purchase-info">
            <h3>${p.itemName}<span class="status-badge ${p.redemptionStatus}">${statusLabel(p.redemptionStatus)}</span></h3>
            <p class="breakdown">${breakdownText(p)} · 합계 ${Number(p.totalAmount).toLocaleString()}원</p>
            <p class="date">${dateStr}</p>
            ${voucherHtml}
          </div>
          <div class="purchase-actions">
            <button class="btn use-btn" ${canAct ? '' : 'disabled'}>사용하기</button>
            <button class="btn refund-btn" ${canAct ? '' : 'disabled'}>환불하기</button>
          </div>
        </div>
      `;
    })
    .join('');

  listEl.querySelectorAll('.use-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      const id = Number(e.target.closest('.purchase-card').dataset.id);
      useVoucher(id);
    });
  });
  listEl.querySelectorAll('.refund-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      const id = Number(e.target.closest('.purchase-card').dataset.id);
      openRefundModal(id);
    });
  });
}

async function loadPurchases() {
  const { data } = await api(`/user/purchases?userId=${session.id}`);
  purchases = data;
  renderList();
}

async function useVoucher(id) {
  const { ok, data } = await api(`/user/purchases/${id}/use`, { method: 'POST' });
  if (ok) {
    alert(`코드가 발급되었습니다: ${data.voucherCode}`);
    loadPurchases();
  } else {
    alert(data.message || '사용 처리 중 오류가 발생했습니다.');
  }
}

function openRefundModal(id) {
  refundTargetId = id;
  const p = purchases.find((x) => x.id === id);
  document.getElementById('refundTargetInfo').textContent = `대상: ${p.itemName} (${breakdownText(p)})`;
  document.getElementById('refundModalOverlay').hidden = false;
}

document.getElementById('refundCancelBtn').addEventListener('click', () => {
  document.getElementById('refundModalOverlay').hidden = true;
  refundTargetId = null;
});

document.getElementById('refundConfirmBtn').addEventListener('click', async () => {
  if (!refundTargetId) return;
  const { ok, data } = await api(`/user/purchases/${refundTargetId}/refund`, { method: 'POST' });
  document.getElementById('refundModalOverlay').hidden = true;
  if (ok) {
    alert('환불이 완료되었습니다. 결제에 사용한 포인트로 되돌아갔습니다.');
    loadPurchases();
  } else {
    alert(data.message || '환불 처리 중 오류가 발생했습니다.');
  }
  refundTargetId = null;
});

if (session) loadPurchases();
</script>
</body>
</html>
